<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resume Analyzer</title>
  <style>
    body{font-family:Arial; background:#f4f6f8; margin:0; padding:20px}
    .container{max-width:900px; margin:20px auto; background:#fff; padding:22px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    h1{margin-top:0}
    .file-row{margin-bottom:14px}
    input[type="file"]{width:100%}
    .big-btn{display:block; width:100%; padding:14px; background:#007bff; color:#fff; border:none; border-radius:8px; font-size:18px; cursor:pointer}
    .big-btn:hover{background:#0056d6}
    .job-list{margin-top:28px}
    .job{padding:12px 0; border-bottom:1px solid #eee}
    .muted{color:#666; font-style:italic}
    select, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; margin-bottom:10px }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload Your Resume</h1>

    <form action="/analyze" method="POST" enctype="multipart/form-data">
      <div class="file-row">
        <input type="file" name="resume" accept=".pdf" required>
      </div>

      <div>
        <label for="selected_role"><strong>Or choose a role to check suitability (optional)</strong></label>
        <select name="selected_role" id="selected_role">
          <option value="">-- Select role (optional) --</option>
          {% for role in roles %}
            <option value="{{ role }}">{{ role }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="job_description"><strong>Paste Job Description (optional)</strong></label>
        <textarea name="job_description" id="job_description" rows="6" placeholder="Paste the job description or required skills here (optional)"></textarea>
      </div>

      <button class="big-btn" type="submit">Analyze Resume</button>
    </form>

    {% if jobs %}
    <div class="job-list">
      <h2 style="margin-top:26px">Sample Job Posts</h2>
      {% for job in jobs %}
        <div class="job">
          <strong>{{ loop.index }}. {{ job.title }}</strong>
          <p>{{ job.description }}</p>
        </div>
      {% endfor %}
    </div>
    {% endif %}

  </div>
</body>
</html>
